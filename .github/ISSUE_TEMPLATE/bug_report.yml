name: 不具合の報告 / Bug report
description: 思ったとおりに動かないところを教えてください / Something does not work as expected
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Issue は誰でも読める公開の場です。**
        実際の船名・会社名・BDNの数量、個人情報は書かないでください。
        数値を示すときは、**実際と桁が同じダミーの値**に置き換えてください（例: `1,000.000 MT`）。

        > Issues are public. Do not post real vessel or company names, BDN quantities, or
        > personal information. Replace figures with dummy values of the same magnitude.

  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きましたか / What happened
      description: 実際にどうなったかを書いてください
      placeholder: 例）記録を保存したのに、累計受油量が増えませんでした
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: どうなると思いましたか / What you expected
      placeholder: 例）保存した分だけ累計が増えると思っていました
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: どの画面で、どの操作をしましたか / Steps
      description: 順番に書いていただけると、こちらで同じ状態を作れます
      placeholder: |
        1. ホーム → 進行中セッションの札をタップ
        2. 「記録の入力」に 温度50 / 密度0.9511 / 体積120 を入力
        3. 「この記録を保存」をタップ
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: アプリのバージョン / App version
      description: アプリ内の サポート → アプリについて → バージョン に出ています
      placeholder: 例）1.0 (1)
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 端末と iOS のバージョン / Device and iOS version
      placeholder: 例）iPhone 15 Pro / iOS 26.5
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: 表示言語 / Display language
      description: 設定 → 言語 で選んでいるもの
      options:
        - 日本語 / Japanese
        - English
        - 端末の設定に従う / Follow device
    validations:
      required: false

  - type: dropdown
    id: reproducible
    attributes:
      label: 毎回起きますか / Does it happen every time
      options:
        - 毎回起きる / Every time
        - ときどき起きる / Sometimes
        - 一度だけ / Only once
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: そのほか / Anything else
      description: |
        スクリーンショットを添える場合は、**実際の船名・数量が写っていないこと**を確認してください。
        この欄に画像をドラッグすると添付できます。
    validations:
      required: false
