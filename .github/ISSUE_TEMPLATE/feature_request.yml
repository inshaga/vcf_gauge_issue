name: 機能のご要望 / Feature request
description: あったら助かる機能・変えてほしいところを教えてください
title: "[要望] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Issue は誰でも読める公開の場です。**
        実際の船名・会社名・BDNの数量、個人情報は書かないでください。

        > Issues are public. Please do not post real vessel or company names, BDN
        > quantities, or personal information.

  - type: textarea
    id: problem
    attributes:
      label: 何に困っていますか / What is inconvenient
      description: |
        **どう直してほしいか**より先に、**何に困っているか**を書いていただけると助かります。
        こちらで別のもっと良い解き方を思いつくことがあるためです。
      placeholder: 例）補油中に前回の採取から何分経ったかが分からず、毎回時計を見ています
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: どうなると良いですか / What would help
      description: 思いつく解き方があれば。無くても構いません
      placeholder: 例）記録一覧に「前回から何分」の列があると助かります
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: どのくらいの頻度で困りますか / How often
      options:
        - 補油のたびに / Every bunkering
        - ときどき / Sometimes
        - 一度そう思っただけ / Just once
    validations:
      required: false
